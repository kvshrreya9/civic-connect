databases:
  - name: civicconnect-db
    databaseName: civicconnect
    user: civicconnect_user
    plan: free

services:
  - type: web
    name: civicconnect-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civicconnect-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production

  - type: static
    name: civicconnect-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://civicconnect-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
